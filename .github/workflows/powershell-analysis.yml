name: PowerShell static analysis

on:
  pull_request:
    paths:
      - "*.ps1"
      - "*.psm1"
      - "*.psd1"
      - "**/*.ps1"
      - "**/*.psm1"
      - "**/*.psd1"
      - ".github/workflows/powershell-analysis.yml"
  push:
    branches: [main]
    paths:
      - "*.ps1"
      - "*.psm1"
      - "*.psd1"
      - "**/*.ps1"
      - "**/*.psm1"
      - "**/*.psd1"
      - ".github/workflows/powershell-analysis.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze PowerShell scripts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force -Repository PSGallery

      - name: Report analyzer errors
        shell: pwsh
        run: |
          $scripts = @(Get-ChildItem -Path . -Recurse -File -Include *.ps1,*.psm1,*.psd1)
          if ($scripts.Count -eq 0) {
            Write-Host "No PowerShell files were found."
            exit 0
          }

          $diagnostics = @(
            foreach ($scriptFile in $scripts) {
              Invoke-ScriptAnalyzer -Path $scriptFile.FullName -Severity Error
            }
          )

          if ($diagnostics.Count -gt 0) {
            $diagnostics | Format-Table -AutoSize | Out-String | Write-Host
            throw "PSScriptAnalyzer found $($diagnostics.Count) error(s)."
          }

          Write-Host "PSScriptAnalyzer found no errors in $($scripts.Count) PowerShell file(s)."
