name: Portfolio quality checks

on:
  pull_request:
    paths:
      - "portfolio-site/**"
      - ".github/scripts/validate-portfolio.py"
      - ".github/workflows/portfolio-validation.yml"
  push:
    branches: [main]
    paths:
      - "portfolio-site/**"
      - ".github/scripts/validate-portfolio.py"
      - ".github/workflows/portfolio-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check JavaScript syntax
        run: node --check portfolio-site/app.js

      - name: Check local page links and assets
        run: python .github/scripts/validate-portfolio.py
