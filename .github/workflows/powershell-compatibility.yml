name: PowerShell syntax compatibility

on:
  pull_request:
    paths:
      - "*.ps1"
      - "*.psm1"
      - "*.psd1"
      - "**/*.ps1"
      - "**/*.psm1"
      - "**/*.psd1"
      - ".github/workflows/powershell-compatibility.yml"
  push:
    branches: [main]
    paths:
      - "*.ps1"
      - "*.psm1"
      - "*.psd1"
      - "**/*.ps1"
      - "**/*.psm1"
      - "**/*.psd1"
      - ".github/workflows/powershell-compatibility.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parse-windows-powershell:
    name: Windows PowerShell 5.1 syntax
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Parse PowerShell files
        shell: powershell
        run: |
          $files = Get-ChildItem -Path . -Recurse -File -Include *.ps1, *.psm1, *.psd1
          if (-not $files) { Write-Host "No PowerShell files found."; exit 0 }
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error "$($file.FullName): $_" }
              exit 1
            }
          }
          Write-Host "All PowerShell files parsed with Windows PowerShell 5.1."

  parse-powershell-core:
    name: PowerShell 7 syntax
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Parse PowerShell files
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path . -Recurse -File -Include *.ps1, *.psm1, *.psd1
          if (-not $files) { Write-Host "No PowerShell files found."; exit 0 }
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error "$($file.FullName): $_" }
              exit 1
            }
          }
          Write-Host "All PowerShell files parsed with PowerShell 7."
