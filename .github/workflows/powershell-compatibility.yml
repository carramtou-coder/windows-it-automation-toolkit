name: PowerShell syntax compatibility

on:
  pull_request:
    paths:
      - "*.ps1"
      - "*.psm1"
      - "*.psd1"
      - "**/*.ps1"
      - "**/*.psm1"
      - "**/*.psd1"
      - ".github/workflows/powershell-compatibility.yml"
  push:
    branches: [main]
    paths:
      - "*.ps1"
      - "*.psm1"
      - "*.psd1"
      - "**/*.ps1"
      - "**/*.psm1"
      - "**/*.psd1"
      - ".github/workflows/powershell-compatibility.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parse:
    name: Parse with ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows PowerShell 5.1
            shell: powershell
          - name: PowerShell 7
            shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Parse all PowerShell files
        shell: ${{ matrix.shell }}
        run: |
          $scripts = @(Get-ChildItem -Path . -Recurse -File -Include *.ps1,*.psm1,*.psd1)
          if ($scripts.Count -eq 0) {
            Write-Host "No PowerShell files were found."
            exit 0
          }

          $failed = $false
          foreach ($scriptFile in $scripts) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $scriptFile.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null

            if ($parseErrors.Count -gt 0) {
              $failed = $true
              foreach ($parseError in $parseErrors) {
                Write-Error "$($scriptFile.FullName): $($parseError.Message) (line $($parseError.Extent.StartLineNumber))"
              }
            }
          }

          if ($failed) {
            throw "One or more PowerShell files do not parse in $($PSVersionTable.PSVersion)."
          }

          Write-Host "All $($scripts.Count) PowerShell file(s) parse in $($PSVersionTable.PSVersion)."
